<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành công</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
        }

        .icon-success {
            width: 64px;
            height: 64px;
            background-color: #d1fae5;
            color: #059669;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }

        h2 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-continue {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-success">✓</div>
    <h2>Đăng ký thành công!</h2>
    <p>Tài khoản của bạn đã được khởi tạo. Chúng tôi đã gửi email xác nhận, vui lòng kiểm tra hộp thư.</p>
    <a href="register.html" class="btn-continue">Bắt đầu trải nghiệm</a>
</div>

</body>
</html>
